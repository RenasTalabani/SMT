name: citygym
description: City GYM - It's a Life Style
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3+1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Real-time
  socket_io_client: ^2.0.3+1

  # Firebase
  firebase_core: ^2.31.1
  firebase_messaging: ^14.9.4

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Video
  video_player: ^2.9.1
  chewie: ^1.8.5
  file_picker: ^8.0.7

  # UI
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  badges: ^3.1.2
  percent_indicator: ^4.2.3
  fl_chart: ^0.67.0
  timeago: ^3.7.0
  intl: ^0.20.2
  share_plus: ^7.0.0

  # Auth — Social + Biometric
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.0.3
  sign_in_with_apple: ^6.1.2
  local_auth: ^2.3.0

  # 3D / WebView
  model_viewer_plus: ^1.8.0
  webview_flutter: ^4.9.0
  url_launcher: ^6.3.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Localization
  easy_localization: ^3.0.7
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
    - assets/models/
    - assets/coach_renas/
    - assets/coach_renas/web/
  # Coach Renas design fonts (SIL Open Font License, see assets/fonts/OFL.txt)
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
