version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citygym_api
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/gymdb
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks:
      - citygym_net

  mongo:
    image: mongo:7
    container_name: citygym_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: gymdb
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - citygym_net

volumes:
  mongo_data:
  uploads:
  logs:

networks:
  citygym_net:
    driver: bridge
